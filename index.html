<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Field Academy — Plataforma de Cursos</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">

    <!-- ══ SIDEBAR ══ -->
    <aside id="sidebar">
      <div id="sidebar-header">
        <div class="logo">
          <span class="logo-icon">⚽</span>
          <span class="logo-text">FIELD<strong>ACADEMY</strong></span>
        </div>
        <div id="course-info">
          <div class="course-label">Curso activo</div>
          <div class="course-title" id="course-title-display">Full Stack Dev</div>
        </div>
      </div>
      <div id="skill-tree-container"></div>
    </aside>

    <!-- ══ MAIN ══ -->
    <main id="main-content">

      <!-- Welcome -->
      <div id="welcome-screen">
        <div class="welcome-inner">
          <div class="welcome-icon">🏆</div>
          <div class="welcome-tag">Field Academy</div>
          <h1>Elige tu siguiente jugada</h1>
          <p>Selecciona un tema del panel izquierdo para comenzar el entrenamiento.</p>
        </div>
      </div>

      <!-- Topic view (inyectado por JS) -->
      <div id="topic-view" class="hidden"></div>

    </main>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
